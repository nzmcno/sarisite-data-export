<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>İlan Veri İndirici</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="ui.css">
  <style>
    html,
    body {
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .panel-head-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: none;
    }

    #main {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 12px 14px;
    }

    .action-bar {
      display: flex;
      gap: 6px;
      padding: 10px 12px;
      background: var(--surface);
      border-top: 1px solid var(--border);
    }

    .action-bar .btn-primary {
      flex: 1 1 auto;
      min-width: 0;
    }

    .crumb {
      font-size: 11px;
      line-height: 14px;
      color: var(--muted);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .hero-title {
      margin-top: 3px;
      font-size: 13px;
      line-height: 18px;
      font-weight: 600;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .hero-figure {
      margin-top: 6px;
      font-size: 28px;
      line-height: 32px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.025em;
    }

    .hero-note {
      margin-top: 2px;
      font-size: 12px;
      line-height: 16px;
      color: var(--muted);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .hero-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
    }

    .rates-cells {
      grid-template-columns: repeat(2, 1fr);
    }

    .rates-cell:nth-child(3) {
      border-left: none;
    }

    .rates-cell:nth-child(n + 3) {
      border-top: 1px solid var(--accent-track);
    }

    .list-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      margin-bottom: 8px;
    }

    .list-tools input {
      width: 100%;
    }

    .row-list {
      display: flex;
      flex-direction: column;
    }

    .list-row {
      border-top: 1px solid var(--rule);
    }

    .list-row-main {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 28px;
      gap: 8px;
      align-items: center;
      padding: 8px 0;
    }

    .list-thumb {
      width: 52px;
      height: 40px;
      object-fit: cover;
      border-radius: 5px;
      background: var(--raised);
      display: block;
    }

    .list-title {
      display: block;
      font-size: 12px;
      line-height: 16px;
      font-weight: 550;
      color: var(--text);
      text-decoration: none;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .list-title:hover {
      color: var(--accent-ink);
      text-decoration: underline;
    }

    .list-price {
      font-size: 13px;
      line-height: 18px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .list-meta {
      display: flex;
      flex-wrap: wrap;
      column-gap: 6px;
      font-size: 11px;
      line-height: 14px;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .expand {
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .expand:hover {
      background: var(--active);
      color: var(--text);
    }

    .expand[aria-expanded="true"] .icon {
      transform: rotate(180deg);
    }

    .list-row-detail {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 0 12px;
    }

    .list-row-detail .card {
      padding: 10px;
      background: var(--raised);
    }

    .state {
      padding: 32px 16px;
      text-align: center;
    }

    .state h2 {
      font-size: 14px;
      line-height: 20px;
      margin-bottom: 4px;
    }

    .state .btn {
      margin-top: 12px;
    }

    .link-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      font-size: 12px;
    }

    .description-text {
      font-size: 12px;
      line-height: 18px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (max-width: 300px) {
      .vehicle-damage {
        grid-template-columns: minmax(0, 1fr);
      }

      .car-diagram {
        max-width: 112px;
      }
    }
  </style>
</head>
<body>
  <header class="panel-head">
    <div class="brand" data-brand-mark><h1 class="brand-name">İlan Veri İndirici</h1></div>
    <div class="panel-head-actions">
      <span id="basketCount" class="pill pill-accent num" hidden></span>
      <button id="workspaceBtn" class="btn btn-icon" type="button" data-icon="open" title="Çalışma alanını aç" aria-label="Çalışma alanını aç"></button>
    </div>
  </header>
  <main id="main"></main>
  <p id="message" class="message" role="status" style="padding: 0 12px 8px"></p>
  <footer id="actions" class="action-bar" hidden></footer>
  <script src="features.js"></script>
  <script src="lib.js"></script>
  <script src="ui.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
